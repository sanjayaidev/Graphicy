<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Client</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div>
      <a href="/" class="back">&larr; All clients</a>
      <h1 class="wordmark" id="client-name" style="margin-top:6px;">Loading…</h1>
    </div>
    <div class="topbar-actions">
      <button class="ghost small" id="edit-client-btn">Edit</button>
      <button class="ghost small" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="detail-grid">
    <div>
      <div class="panel">
        <h3>Client info</h3>
        <div id="info-body"><div class="loading">Loading…</div></div>
      </div>

      <div class="panel">
        <h3>Activity history</h3>
        <div class="timeline" id="history-body"><div class="loading">Loading…</div></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>Tasks</h3>
        <div id="tasks-body"><div class="loading">Loading…</div></div>
        <div class="inline-add">
          <input id="new-task-desc" placeholder="New task…">
          <input id="new-task-due" type="date" style="max-width:160px;">
          <button class="primary" id="add-task-btn">Add</button>
        </div>
      </div>

      <div class="panel">
        <h3>Payments</h3>
        <div id="payments-body"><div class="loading">Loading…</div></div>
        <div class="inline-add">
          <input id="new-payment-amount" type="number" placeholder="Amount" style="max-width:110px;">
          <select id="new-payment-status" style="max-width:120px;">
            <option>Paid</option><option>Pending</option><option>Overdue</option>
          </select>
          <input id="new-payment-notes" placeholder="Notes (optional)">
          <button class="primary" id="add-payment-btn">Log</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Edit modal (reuses dashboard's field set) -->
<div class="modal-backdrop" id="client-modal">
  <div class="modal">
    <h2>Edit client</h2>
    <form id="client-form">
      <div class="modal-grid">
        <div class="field"><label>Name</label><input id="f-name" required></div>
        <div class="field"><label>Number</label><input id="f-number"></div>
        <div class="field"><label>Country</label><input id="f-country"></div>
        <div class="field"><label>Platform</label><input id="f-platform"></div>
        <div class="field">
          <label>Status</label>
          <select id="f-type"><option>Warm</option><option>Cold</option><option>Old</option><option>New</option></select>
        </div>
        <div class="field"><label>Chance (%)</label><input id="f-chance" type="number" min="0" max="100"></div>
        <div class="field"><label>Service</label><input id="f-service"></div>
        <div class="field"><label>Business</label><input id="f-business"></div>
        <div class="field"><label>Payment status</label>
          <select id="f-payment-status"><option>Pending</option><option>Paid</option><option>Overdue</option></select>
        </div>
        <div class="field" style="grid-column: 1 / -1;"><label>Next action</label><input id="f-action"></div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Notes</label>
          <textarea id="f-notes" rows="3" placeholder="Anything worth remembering about this client…"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="primary">Update client</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/client.js"></script>
</body>
</html>
